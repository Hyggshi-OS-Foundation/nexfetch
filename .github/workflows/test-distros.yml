name: Test build & run (Arch/Debian/Fedora/Windows/macOS)

# Verifies nexfetch actually builds and runs on each target platform,
# instead of only finding out something's broken at release time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Linux distros — native containers
  # ------------------------------------------------------------------
  test-linux-distro:
    name: Test on ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
          - name: Debian
            image: debian:12
          - name: Fedora
            image: fedora:latest
          - name: Linux Mint
            image: linuxmintd/mint21.3-amd64
          - name: Ubuntu
            image: ubuntu:24.04
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
          - name: Alpine
            image: alpine:latest
          - name: Manjaro
            image: manjarolinux/base:latest
          - name: Void Linux
            image: voidlinux/voidlinux:latest
          - name: Rocky Linux
            image: rockylinux:9
          - name: Xubuntu
            image: ubuntu:24.04
          - name: Kubuntu
            image: ubuntu:24.04
          - name: Lubuntu
            image: ubuntu:24.04
          - name: CachyOS
            image: cachyos/cachyos:latest
          - name: CaramOS
            image: ubuntu:24.04
          - name: Gentoo
            image: gentoo/stage3:latest

    steps:
      # Install build tools using each distro's own package manager
      - name: Install dependencies (Arch-based)
        if: >
          matrix.name == 'Arch Linux' ||
          matrix.name == 'Manjaro'    ||
          matrix.name == 'CachyOS'
        run: pacman -Syu --noconfirm --needed base-devel git

      - name: Install dependencies (apt-based)
        if: >
          matrix.name == 'Debian'     ||
          matrix.name == 'Linux Mint' ||
          matrix.name == 'Ubuntu'     ||
          matrix.name == 'Xubuntu'   ||
          matrix.name == 'Kubuntu'   ||
          matrix.name == 'Lubuntu'   ||
          matrix.name == 'CaramOS'
        run: |
          apt-get update
          apt-get install -y build-essential git

      - name: Install dependencies (Fedora / Rocky Linux)
        if: >
          matrix.name == 'Fedora' ||
          matrix.name == 'Rocky Linux'
        run: dnf install -y gcc make git

      - name: Install dependencies (openSUSE Tumbleweed)
        if: matrix.name == 'openSUSE Tumbleweed'
        run: zypper --non-interactive install -y gcc make git

      - name: Install dependencies (Alpine)
        if: matrix.name == 'Alpine'
        run: apk add --no-cache build-base git

      - name: Install dependencies (Void Linux)
        if: matrix.name == 'Void Linux'
        run: |
          # The container's default repo (alpha.de.repo.voidlinux.org) has a
          # recurring TLS cert/hostname mismatch. Point at the Fastly-backed
          # mirror instead, sync xbps itself first, then install packages.
          xbps-install -Syu --yes -R https://repo-fastly.voidlinux.org/current xbps
          xbps-install -Syu --yes -R https://repo-fastly.voidlinux.org/current base-devel git

      - name: Install dependencies (Gentoo)
        if: matrix.name == 'Gentoo'
        run: |
          emerge-webrsync
          emerge --getbinpkg sys-devel/gcc dev-build/make dev-vcs/git

      - name: Clone repo
        uses: actions/checkout@v4

      # Build from source directly on the real distro
      - name: Build nexfetch
        run: |
          make clean || true
          make -j"$(nproc)"

      - name: Verify the binary was produced
        run: |
          test -f ./nexfetch
          ls -lh ./nexfetch

      # Run it in place first, before installing system-wide
      - name: Run ./nexfetch
        run: ./nexfetch

      - name: Run ./nexfetch --no-logo (doesn't require chafa)
        run: ./nexfetch --no-logo

      - name: Run ./nexfetch --list-modules
        run: ./nexfetch --list-modules

      # make install, then run via the "nexfetch" command like a real user
      - name: make install
        run: make install PREFIX=/usr

      - name: Run the nexfetch command (after install, from PATH)
        run: nexfetch

      - name: Check nexfetch --version
        run: nexfetch --version

      - name: make uninstall (cleanup)
        run: make uninstall

  # ------------------------------------------------------------------
  # NixOS — not run as a `container:` job. Pure Nix-store images
  # (nixos/nix, etc.) have no FHS layout (no /lib64/ld-linux-x86-64.so.2
  # and friends), and GitHub Actions injects its own prebuilt Node.js
  # binary into container jobs to run "uses:" steps and post-job cleanup.
  # That Node binary can't find a dynamic loader on a pure-Nix rootfs, so
  # every containerized action step (including internal cleanup) fails
  # with "no such file or directory" even though the file exists. Instead,
  # install Nix on the normal (FHS-compatible) ubuntu-latest runner and use
  # nix-shell just to provide gcc/make for the build.
  # ------------------------------------------------------------------
  test-nixos:
    name: Test on NixOS (via Nix package manager)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build nexfetch
        run: |
          nix-shell -p gcc gnumake --run '
            make clean || true
            make -j"$(nproc)"
          '

      - name: Verify the binary was produced
        run: |
          test -f ./nexfetch
          ls -lh ./nexfetch

      - name: Run ./nexfetch
        run: ./nexfetch

      - name: Run ./nexfetch --no-logo (doesn't require chafa)
        run: ./nexfetch --no-logo

      - name: Run ./nexfetch --list-modules
        run: ./nexfetch --list-modules

  # ------------------------------------------------------------------
  # Windows — native runner, built via MSYS2/MinGW64 toolchain
  # ------------------------------------------------------------------
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain

      - name: Build nexfetch.exe
        run: |
          make clean || true
          make -j"$(nproc)"

      - name: Verify the binary was produced
        run: |
          test -f ./nexfetch.exe
          ls -lh ./nexfetch.exe

      - name: Run ./nexfetch.exe
        run: ./nexfetch.exe

      - name: Run ./nexfetch.exe --no-logo
        run: ./nexfetch.exe --no-logo

      - name: Run ./nexfetch.exe --list-modules
        run: ./nexfetch.exe --list-modules

  # ------------------------------------------------------------------
  # macOS — native runner (Xcode command line tools already provide
  # clang + make, matching what the Makefile picks for Darwin)
  # ------------------------------------------------------------------
  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Build nexfetch
        run: |
          make clean || true
          make -j"$(sysctl -n hw.ncpu)"

      - name: Verify the binary was produced
        run: |
          test -f ./nexfetch
          ls -lh ./nexfetch

      - name: Run ./nexfetch
        run: ./nexfetch

      - name: Run ./nexfetch --no-logo
        run: ./nexfetch --no-logo

      - name: Run ./nexfetch --list-modules
        run: ./nexfetch --list-modules

      - name: make install
        run: sudo make install PREFIX=/usr/local

      - name: Run the nexfetch command (after install, from PATH)
        run: nexfetch

      - name: Check nexfetch --version
        run: nexfetch --version

      - name: make uninstall (cleanup)
        run: sudo make uninstall PREFIX=/usr/local