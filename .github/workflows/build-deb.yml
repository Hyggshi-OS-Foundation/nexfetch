---
name: Build & Publish .deb Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            gcc \
            make \
            crossbuild-essential-arm64 \
            libc6:arm64 \
            reprepro \
            gnupg

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          dch --newversion "${VERSION}-1" --distribution unstable \
            "Release version ${VERSION}"

      - name: Build for amd64
        if: matrix.arch == 'amd64'
        run: |
          make clean
          dpkg-buildpackage -us -uc -b -d -aamd64
          mkdir -p dist
          mv ../nexfetch_*.deb dist/ 2>/dev/null || true
          mv ../nexfetch_*.buildinfo dist/ 2>/dev/null || true
          mv ../nexfetch_*.changes dist/ 2>/dev/null || true

      - name: Build for arm64
        if: matrix.arch == 'arm64'
        env:
          CC: aarch64-linux-gnu-gcc
          DEB_HOST_ARCH: arm64
          DEB_BUILD_OPTIONS: nocheck
        run: |
          make clean
          dpkg-buildpackage -us -uc -b -d -aarm64
          mkdir -p dist
          mv ../nexfetch_*.deb dist/ 2>/dev/null || true
          mv ../nexfetch_*.buildinfo dist/ 2>/dev/null || true
          mv ../nexfetch_*.changes dist/ 2>/dev/null || true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexfetch-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: warn

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-apt-repo:
    name: Publish to central Hyggshi APT repository
    needs: build-deb
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nexfetch-deb-*
          merge-multiple: true
          path: debs

      - name: Install apt-repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Import fixed GPG signing key
        run: |
          sudo apt-get install -y pinentry-tty
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-program $(which pinentry-tty)" > ~/.gnupg/gpg-agent.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "batch" >> ~/.gnupg/gpg.conf
          echo "no-tty" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpgconf --reload gpg-agent

      - name: Checkout central apt-repo (gh-pages)
        uses: actions/checkout@v4
        with:
          repository: Hyggshi-OS-Foundation/apt-repo
          ref: gh-pages
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo

      - name: Include all .deb into central repo
        run: |
          cd apt-repo
          shopt -s nullglob
          debs=(../debs/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "No .deb files found to publish!"
            exit 1
          fi
          for deb in "${debs[@]}"; do
            echo "Including $deb ..."
            reprepro includedeb stable "$deb"
          done

      - name: Commit and push to central apt-repo
        run: |
          cd apt-repo
          git config user.name "Hyggshi CI Bot"
          git config user.email "ci@hyggshi.os"
          git add dists pool
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "Publish nexfetch ${{ github.ref_name }} via CI" && git push origin gh-pages)