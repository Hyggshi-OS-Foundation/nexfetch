name: Build macOS (Universal)
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-universal:
    name: Build & Package (macOS Universal - amd64 + aarch64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile nexfetch (x86_64)
        run: |
          clang -O2 -Iinclude -arch x86_64 \
            -o nexfetch-x86_64 src/*.c modules/*.c platform/*/*.c -ldl

      - name: Compile nexfetch (arm64)
        run: |
          clang -O2 -Iinclude -arch arm64 \
            -o nexfetch-arm64 src/*.c modules/*.c platform/*/*.c -ldl

      - name: Merge into Universal Binary
        run: |
          lipo -create -output nexfetch nexfetch-x86_64 nexfetch-arm64
          chmod +x nexfetch
          lipo -info nexfetch

      - name: Verify Binary
        run: |
          ./nexfetch --version || true

      - name: Create Release Packages & Checksums
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "v0.1.0")
          PKG_NAME="nexfetch-macos-universal"

          mkdir -p dist/${PKG_NAME}
          cp nexfetch README.md LICENSE dist/${PKG_NAME}/ 2>/dev/null || true

          # Package .tar.gz
          tar -czvf dist/${PKG_NAME}.tar.gz -C dist ${PKG_NAME}
          # Package .zip
          (cd dist && zip -r ${PKG_NAME}.zip ${PKG_NAME})

          # Calculate SHA256 Checksums
          cd dist
          for file in ${PKG_NAME}.tar.gz ${PKG_NAME}.zip; do
            if [ -f "$file" ]; then
              shasum -a 256 "$file" >> sha256sums.txt
            fi
          done
          echo "Generated SHA256 Checksums:"
          cat sha256sums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexfetch-macos-universal
          path: |
            dist/*.*
