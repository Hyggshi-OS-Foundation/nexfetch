name: Create & Upload Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Work Directories
        run: mkdir -p artifacts release_assets

      - name: Download Artifacts (Current Workflow)
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Download Artifacts (Cross-Workflow via GitHub CLI)
        run: |
          gh run download --repo "${{ github.repository }}" --dir artifacts 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Directory & Consolidate Checksums
        run: |
          # Copy non-empty build packages from artifacts into release_assets
          find artifacts -type f -size +0c \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.7z" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg" \) -exec cp {} release_assets/ \; 2>/dev/null || true

          # Remove any 0-byte files if present
          find release_assets -type f -size 0 -delete 2>/dev/null || true

          # Calculate SHA256 checksums for all valid release files
          cd release_assets
          rm -f sha256sums.txt
          
          for file in *; do
            if [ -f "$file" ] && [ -s "$file" ]; then
              sha256sum "$file" >> sha256sums.txt 2>/dev/null || shasum -a 256 "$file" >> sha256sums.txt 2>/dev/null || true
            fi
          done

          echo "Release Assets List:"
          ls -la
          echo "Consolidated SHA256 Checksums:"
          cat sha256sums.txt 2>/dev/null || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
