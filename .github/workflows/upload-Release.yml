name: Create & Upload Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'v1.0.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Directory & Consolidate Checksums
        run: |
          mkdir -p release_assets
          
          # Move all packaged files into release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.7z" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release_assets/ \;
          
          # Regenerate consolidated SHA256 checksum file
          cd release_assets
          rm -f sha256sums.txt
          sha256sum * > sha256sums.txt 2>/dev/null || shasum -a 256 * > sha256sums.txt 2>/dev/null || true
          
          echo "Release Assets List:"
          ls -la
          echo "Consolidated SHA256 Checksums:"
          cat sha256sums.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
