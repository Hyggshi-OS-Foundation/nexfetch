name: Build linux-armv6l

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux-armv6l:
    name: Build & Package (linux-armv6l)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make zip tar p7zip-full rpm dpkg-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install make zip tar p7zip

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install 7zip make -y

      - name: Compile nexfetch
        shell: bash
        run: |
          make clean || true
          make || gcc -O2 -Iinclude -o nexfetch src/*.c modules/*.c platform/*/*.c -ldl || true

      - name: Verify Binary
        shell: bash
        run: |
          if [ -f "./nexfetch" ]; then
            ./nexfetch --version || true
          elif [ -f "./nexfetch.exe" ]; then
            ./nexfetch.exe --version || true
          fi

      - name: Create Release Packages & Checksums
        shell: bash
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "v0.1.0")
          PKG_NAME="nexfetch-linux-armv6l"
          
          mkdir -p dist/${PKG_NAME}
          if [ -f "nexfetch.exe" ]; then
            cp nexfetch.exe README.md LICENSE dist/${PKG_NAME}/
          else
            cp nexfetch README.md LICENSE dist/${PKG_NAME}/ 2>/dev/null || true
          fi

          # Package .tar.gz
          tar -czvf dist/${PKG_NAME}.tar.gz -C dist ${PKG_NAME}

          # Package .zip
          (cd dist && zip -r ${PKG_NAME}.zip ${PKG_NAME})

          # Package .deb
          DEB_DIR="dist/deb/${PKG_NAME}"
          mkdir -p ${DEB_DIR}/usr/local/bin ${DEB_DIR}/DEBIAN
          cp nexfetch ${DEB_DIR}/usr/local/bin/ 2>/dev/null || cp nexfetch.exe ${DEB_DIR}/usr/local/bin/ 2>/dev/null || true
          cat << 'EOF' > ${DEB_DIR}/DEBIAN/control
          Package: nexfetch
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: HyggshiOSDeveloper <hyggshidev@gmail.com>
          Description: System information fetch tool
          EOF
          dpkg-deb --build ${DEB_DIR} dist/${PKG_NAME}.deb || true

          # Calculate SHA256 Checksums
          cd dist
          for file in ${PKG_NAME}.deb ${PKG_NAME}.tar.gz ${PKG_NAME}.zip; do
            if [ -f "$file" ] && [ -s "$file" ]; then
              sha256sum "$file" >> sha256sums.txt 2>/dev/null || shasum -a 256 "$file" >> sha256sums.txt 2>/dev/null || true
            fi
          done
          echo "Generated SHA256 Checksums:"
          cat sha256sums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexfetch-linux-armv6l
          path: |
            dist/*.*
